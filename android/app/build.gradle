// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Updated to 8.14.0 to natively match your Gradle 8.14.3 wrapper
        classpath 'com.android.tools.build:gradle:8.14.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// SAFE CONDITIONAL IMPORT: Prevents CI pipeline from crashing if variables.gradle is ignored by Git
def variablesFile = file("variables.gradle")
if (variablesFile.exists()) {
    apply from: variablesFile
} else {
    logger.warn("⚠️ variables.gradle not found; skipping local variable injection for this environment.")
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Updated clean task matching modern Gradle 8.x standards
tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
